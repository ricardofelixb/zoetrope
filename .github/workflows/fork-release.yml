name: Fork release

# Builds the `zoe` binaries for a tag on this fork and attaches them to a
# GitHub release, with the built-in token only: no signing key, tap or registry.
# Upstream's own release workflows need its secrets and stay disabled here.
on:
  push:
    tags: ["v*-rf.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build the binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package it
        shell: bash
        run: |
          archive="zoetrope-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$archive"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/zoe.exe" "$archive/"
            7z a "$archive.zip" "$archive"
          else
            cp "target/${{ matrix.target }}/release/zoe" "$archive/"
            tar czf "$archive.tar.gz" "$archive"
          fi

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: zoetrope-${{ github.ref_name }}-${{ matrix.target }}.*
