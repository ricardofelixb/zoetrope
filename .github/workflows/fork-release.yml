name: Fork release

# Builds the `zoe` binaries for a tag on this fork and attaches them to a
# GitHub release, with the built-in token only: no signing key, tap or registry.
# Upstream's own release workflows need its secrets and stay disabled here.
# Tags are `v*-rf.*` or the calendar `v<year>.<month*100+day>.<n>`; the tag is
# used verbatim in the asset names, nothing is derived from it.
on:
  push:
    tags: ["v*-rf.*", "v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build the binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package it
        shell: bash
        run: |
          archive="zoetrope-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$archive"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/zoe.exe" "$archive/"
            7z a "$archive.zip" "$archive"
          else
            cp "target/${{ matrix.target }}/release/zoe" "$archive/"
            tar czf "$archive.tar.gz" "$archive"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: zoetrope-${{ matrix.target }}
          path: zoetrope-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error
          # A re-run of a failed run uploads the same names again.
          overwrite: true

  # Runs only when every target built, and publishes last, so "latest" never
  # points at a release that is missing a build.
  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          ls -l dist
          # A draft until every asset is attached. Each step can be repeated, so
          # a re-run finishes a release that an earlier attempt left half done.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
